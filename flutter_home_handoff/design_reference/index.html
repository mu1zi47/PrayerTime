<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Намаз — Главная v0.5</title><style>
:root{--bg:#0b192c;--surface:#15263c;--gold:#e9b950;--text:#f4f2ef;--muted:#9ca8b7;--line:#24364a;--green:#58bd91}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,'Segoe UI',Arial,sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}.app{max-width:440px;margin:auto;min-height:100dvh;padding:42px 24px 48px}.top{display:flex;justify-content:space-between;align-items:center;margin:10px 0 38px}.city,.settings{background:none;border:0;color:var(--text);display:flex;align-items:center;gap:8px}.city{font-size:19px;font-weight:650}.city .pin{color:var(--gold);font-size:23px}.chevron{font-size:18px;color:var(--muted)}.settings{padding:8px}.settings svg{width:25px;height:25px}.next{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin-bottom:32px}.eyebrow{font-size:15px;color:#c2c8d0;margin:0 0 8px}.prayer-name{font-size:57px;line-height:1.04;font-weight:750;letter-spacing:-2px;margin:0}.next .underline{height:3px;width:42px;background:var(--gold);border-radius:3px;margin-top:19px}.countdown{border:1px solid #6d5730;background:linear-gradient(135deg,#30302d,#1c252e 65%,#252a2b);box-shadow:inset 0 0 0 1px #3d3b31,0 0 15px #d8a84912;border-radius:28px;padding:14px 16px;text-align:center;min-width:171px}.countdown .small{color:var(--gold);font-weight:650;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px}.countdown strong{display:block;color:var(--gold);font-size:31px;line-height:1.4;letter-spacing:1px;font-variant-numeric:tabular-nums}.section-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 18px}.section-heading h2{margin:0;font-size:20px;letter-spacing:-.35px}.text-link{border:0;background:none;color:var(--gold);font-size:16px;padding:6px 0;white-space:nowrap}.shortcuts{margin-bottom:34px}.shortcut-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.shortcut{height:108px;border:1px solid #2b4058;border-radius:22px;background:linear-gradient(150deg,#1a3048,#14263c);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px 4px;text-align:center;box-shadow:inset 0 1px #ffffff0b}.shortcut svg{width:30px;height:30px;color:var(--gold);stroke-width:1.8}.shortcut span{font-size:13px;line-height:1.25;font-weight:550}.schedule .section-heading{margin-bottom:11px}.prayer-row{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--text);display:grid;grid-template-columns:48px minmax(0,1fr) auto 14px;gap:12px;align-items:center;min-height:72px;padding:10px 8px;text-align:left}.prayer-row .pname{font-size:18px;font-weight:650}.prayer-row .ptime{font-size:18px;font-weight:650;font-variant-numeric:tabular-nums}.prayer-row .arrow{color:#8998a8;font-size:21px}.status{height:44px;width:44px;border-radius:15px;background:#182b42;display:flex;align-items:center;justify-content:center;color:var(--gold)}.status svg{width:27px;height:27px}.status.done{background:#183b3d;color:#d7fff0}.status.done .checkcircle{background:var(--green);width:30px;height:30px;border-radius:50%;display:grid;place-items:center}.status.done .checkcircle svg{width:21px;height:21px}.status.empty{background:transparent;color:#aab6c4}.status.empty svg{width:24px;height:24px}.prayer-row.active{position:relative;background:linear-gradient(100deg,#393832,#272e34);border:1px solid #6b5736;border-radius:24px;box-shadow:inset 0 0 0 1px #594a33,0 0 12px #caa3481a;margin:7px -6px;width:calc(100% + 12px);padding-left:14px;padding-right:14px}.prayer-row.active .pname,.prayer-row.active .ptime{color:var(--gold)}.prayer-row.active .status{background:#403b2e}.prayer-row.active + .prayer-row{border-top:0}.overlay{position:fixed;inset:0;background:#0009;display:none;align-items:end;justify-content:center;z-index:3}.overlay.show{display:flex}.sheet{width:min(100%,440px);background:#17283e;border-radius:26px 26px 0 0;padding:12px 22px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px #0005}.handle{width:38px;height:4px;background:#56657a;border-radius:4px;margin:0 auto 20px}.sheet h3{text-align:center;margin:0 0 5px;font-size:22px}.sheet p{text-align:center;color:var(--muted);font-size:13px;margin:0 0 20px}.sheet-action{display:flex;align-items:center;gap:14px;background:#21344b;color:var(--text);width:100%;border:1px solid #30455d;border-radius:13px;padding:17px;margin:8px 0;text-align:left}.sheet-action svg{width:22px;height:22px;color:var(--gold)}.sheet-action.danger{background:transparent;color:#bec7d0}.sheet-action.danger svg{color:#bec7d0}.hint{font-size:12px;color:#718094;margin:18px 0 0;text-align:center}.tool-row{display:flex;align-items:center;justify-content:space-between;width:100%;padding:15px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--text);text-align:left}.tool-row.selected{color:var(--gold)}@media(max-width:365px){.app{padding-left:17px;padding-right:17px}.prayer-name{font-size:48px}.countdown{min-width:150px;padding:12px 9px}.countdown strong{font-size:27px}.shortcut{height:102px}.shortcut span{font-size:12px}.prayer-row{gap:8px;grid-template-columns:42px minmax(0,1fr) auto 12px}.status{height:40px;width:40px}}
</style></head><body><main class="app"><header class="top"><button class="city" id="city"><span class="pin">●</span> Ташкент <span class="chevron">⌄</span></button><button class="settings" id="settings" aria-label="Настройки"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l2 1 2-.5 1.5 2.5 2.5 1-.5 3 1.5 2-1.5 2 .5 3-2.5 1-1.5 2.5-2-.5-2 1-2-1-2 .5L6.5 18l-2.5-1 .5-3L3 12l1.5-2-.5-3 2.5-1L8 3.5l2 .5z"/><circle cx="12" cy="12" r="3"/></svg></button></header><section class="next" aria-label="Следующий намаз"><div><p class="eyebrow">Следующий намаз · Завтра</p><h1 class="prayer-name">Фаджр</h1><div class="underline"></div></div><div class="countdown"><div class="small">◷ через</div><strong id="countdown">06:55:00</strong></div></section><section class="shortcuts"><div class="section-heading"><h2>Быстрый доступ</h2><button class="text-link" id="all">Все ›</button></div><div class="shortcut-grid" id="shortcuts"></div></section><section class="schedule"><div class="section-heading"><h2>Сегодня</h2><button class="text-link" id="month">На месяц ›</button></div><div id="prayers"></div></section><p class="hint">Демонстрационные времена и статусы · HTML/CSS UX-прототип v0.5</p></main><div class="overlay" id="overlay" role="presentation"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div><script>
const icons={mosque:'<path d="M3 21V10h18v11M6 10V7l6-4 6 4v3M9 21v-6a3 3 0 0 1 6 0v6M2 10h20M4 6V3M20 6V3"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M8 15l3 3 5-5"/>',stars:'<path d="m12 2 1.8 5.2L19 9l-5.2 1.8L12 16l-1.8-5.2L5 9l5.2-1.8zM20 15l.8 2.2L23 18l-2.2.8L20 21l-.8-2.2L18 18l1.2-.8z"/>',beads:'<circle cx="12" cy="12" r="8"/><path d="M12 4v4M12 16v4M4 12h4M16 12h4"/>',month:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M8 14h3M8 17h8"/>',check:'<path d="M5 12l5 5L19 7"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 3"/>',sun:'<path d="M3 19h18M5 15h14M7 15a5 5 0 0 1 10 0M12 2v3M4 8l2 2M20 8l-2 2"/>',empty:'<circle cx="12" cy="12" r="9"/>'};const svg=(n)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[n]}</svg>`;
const tools=[{id:'mosque',label:'Карта мечетей',icon:'mosque'},{id:'calendar',label:'Календарь намазов',icon:'calendar'},{id:'names',label:'Имена Аллаха',icon:'stars'},{id:'tasbih',label:'Тасбих',icon:'beads'},{id:'month',label:'Расписание на месяц',icon:'month'}];let shortcuts=JSON.parse(localStorage.getItem('prayerShortcutsV05')||'["mosque","calendar","names"]');let prayerData=[{name:'Фаджр',time:'05:49',status:'done'},{name:'Восход',time:'07:11',status:'sun'},{name:'Зухр',time:'12:07',status:'done'},{name:'Аср',time:'15:23',status:'late'},{name:'Магриб',time:'17:08',status:'done'},{name:'Иша',time:'18:26',status:'none'}];const overlay=document.getElementById('overlay'),sheet=document.getElementById('sheet');function open(html){sheet.innerHTML='<div class="handle"></div>'+html;overlay.classList.add('show')}function close(){overlay.classList.remove('show')}overlay.addEventListener('click',e=>{if(e.target===overlay)close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});function renderShortcuts(){document.getElementById('shortcuts').innerHTML=shortcuts.map(id=>{let t=tools.find(x=>x.id===id);return `<button class="shortcut" data-tool="${id}">${svg(t.icon)}<span>${t.label}</span></button>`}).join('');document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>open(`<h3>${tools.find(t=>t.id===b.dataset.tool).label}</h3><p>В Flutter здесь откроется существующий экран.</p><button class="sheet-action" onclick="close()">Закрыть</button>`))}function renderPrayers(){document.getElementById('prayers').innerHTML=prayerData.map((p,i)=>{let status=p.status==='done'?`<span class="status done"><span class="checkcircle">${svg('check')}</span></span>`:p.status==='late'?`<span class="status">${svg('clock')}</span>`:p.status==='sun'?`<span class="status">${svg('sun')}</span>`:`<span class="status empty">${svg('empty')}</span>`;return `<button class="prayer-row ${p.status==='late'?'active':''}" data-prayer="${i}">${status}<span class="pname">${p.name}</span><span class="ptime">${p.time}</span><span class="arrow">${p.status==='sun'?'':'›'}</span></button>`}).join('');document.querySelectorAll('[data-prayer]').forEach(b=>b.onclick=()=>{let i=Number(b.dataset.prayer);if(prayerData[i].status==='sun')return;open(`<h3>Как прошёл ${prayerData[i].name}?</h3><p>Выберите отметку</p><button class="sheet-action" data-status="done">${svg('check')} Прочитал вовремя</button><button class="sheet-action" data-status="late">${svg('clock')} Прочитал с опозданием</button>${prayerData[i].status!=='none'?`<button class="sheet-action danger" data-status="none">✕ Убрать отметку</button>`:''}`);document.querySelectorAll('[data-status]').forEach(x=>x.onclick=()=>{prayerData[i].status=x.dataset.status;renderPrayers();close()})})}function catalog(){open(`<h3>Все инструменты</h3><p>Нажмите «Настроить», чтобы заменить три кнопки на главной</p>${tools.map(t=>`<button class="tool-row" data-open="${t.id}">${t.label}<span>›</span></button>`).join('')}<button class="sheet-action" id="editShortcuts">Настроить быстрый доступ</button>`);document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>open(`<h3>${tools.find(t=>t.id===b.dataset.open).label}</h3><p>Здесь будет переход к существующему экрану.</p><button class="sheet-action" onclick="catalog()">Назад</button>`));document.getElementById('editShortcuts').onclick=()=>editShortcuts(0)}function editShortcuts(slot){open(`<h3>Быстрый доступ</h3><p>Выберите инструмент для кнопки ${slot+1} из 3</p>${tools.map(t=>`<button class="tool-row ${shortcuts[slot]===t.id?'selected':''}" data-choose="${t.id}">${t.label}${shortcuts[slot]===t.id?' ✓':''}</button>`).join('')}<button class="sheet-action" onclick="close()">Готово</button>`);document.querySelectorAll('[data-choose]').forEach(b=>b.onclick=()=>{let old=shortcuts[slot],id=b.dataset.choose,other=shortcuts.indexOf(id);shortcuts[slot]=id;if(other!==-1&&other!==slot)shortcuts[other]=old;localStorage.setItem('prayerShortcutsV05',JSON.stringify(shortcuts));renderShortcuts();editShortcuts((slot+1)%3)})}document.getElementById('all').onclick=catalog;document.getElementById('month').onclick=()=>open('<h3>Расписание на месяц</h3><p>В Flutter откроется существующий экран месячного расписания.</p><button class="sheet-action" onclick="close()">Закрыть</button>');document.getElementById('city').onclick=()=>open('<h3>Выбор города</h3><p>В Flutter откроется существующий экран выбора города.</p><button class="sheet-action" onclick="close()">Закрыть</button>');document.getElementById('settings').onclick=()=>open('<h3>Настройки</h3><p>В Flutter откроется существующий экран настроек.</p><button class="sheet-action" onclick="close()">Закрыть</button>');renderShortcuts();renderPrayers();
</script></body></html>
